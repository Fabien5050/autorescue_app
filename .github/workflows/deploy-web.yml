name: Deploy web build to Cloudflare Pages

# Builds the Flutter web target and publishes it to Cloudflare Pages on
# every push to main, so the app is reachable from a real URL (any device,
# no emulator/APK needed) without a manual build+upload step each time.
# Replaced GitHub Pages — same push-to-deploy workflow, faster CDN.
#
# One-time setup this workflow depends on:
#   1. A Cloudflare Pages project named "autorescue-app" (Direct Upload
#      type — this workflow pushes the build, Cloudflare doesn't need to
#      know how to build Flutter itself).
#   2. Two repo secrets (Settings > Secrets and variables > Actions):
#      CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID, from the Cloudflare
#      dashboard (My Profile > API Tokens, and the account sidebar).
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      # --base-href is "/" (not a repo-name subpath like the old GitHub
      # Pages setup needed) since Cloudflare Pages serves a project at the
      # root of its own domain. API_BASE_URL points the app at the hosted
      # backend instead of the localhost default, which no visitor's
      # browser could reach.
      - run: |
          flutter build web --release \
            --base-href "/" \
            --dart-define=API_BASE_URL=https://autorecue-backend.onrender.com

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: autorescue-app
          directory: build/web
