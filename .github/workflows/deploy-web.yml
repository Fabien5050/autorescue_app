name: Deploy web build to GitHub Pages

# Builds the Flutter web target and publishes it to GitHub Pages on every
# push to main, so the app is reachable from a real URL (any device, no
# emulator/APK needed) without a manual build+upload step each time.
#
# One-time setup this workflow depends on: in the repo's Settings > Pages,
# set Source to "GitHub Actions" (not "Deploy from a branch").
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      # --base-href must match the repo name since GitHub Pages serves a
      # project site under /<repo>/, not /. API_BASE_URL points the app at
      # the hosted backend instead of the localhost default, which no
      # visitor's browser could reach.
      - run: |
          flutter build web --release \
            --base-href "/autorescue_app/" \
            --dart-define=API_BASE_URL=https://autorecue-backend.onrender.com

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
